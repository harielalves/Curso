<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oficina da Moto – Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e4e8eb;--card:#f6f8f9;--ink:#14343b;--mute:#52666b;--line:#b9c3c8;--tape:#f2b705;--ok:#1f7a4d;--bad:#b3342b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12191b;--card:#1b272a;--ink:#e8eef0;--mute:#9fb0b5;--line:#33464b;--ok:#4cc38a;--bad:#ef7b72}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 Barlow,system-ui,sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1,h2,.big{font-family:"Barlow Condensed",Impact,sans-serif;font-weight:800;letter-spacing:.01em;margin:0;line-height:1.05}
h1{font-size:48px}h2{font-size:28px;line-height:1.2}
.tape{height:10px;border-radius:2px;margin:0 0 18px;background:repeating-linear-gradient(-45deg,var(--tape) 0 14px,#14343b 14px 28px)}
.card{background:var(--card);border:2px solid var(--line);border-radius:6px;padding:18px}
p{margin:.6em 0}.mute{color:var(--mute)}
input{width:100%;font:inherit;padding:12px;border:2px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);margin:8px 0 14px}
button{font:600 17px Barlow,sans-serif;cursor:pointer;color:var(--ink)}
.go{width:100%;background:var(--tape);color:#14343b;border:2px solid #14343b;border-radius:4px;padding:13px;font-size:19px}
.opt{display:block;width:100%;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:4px;padding:12px 14px;margin:9px 0}
.opt:focus-visible,.go:focus-visible,input:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--bg))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--bg))}
.bar{display:flex;justify-content:space-between;font-weight:600;margin-bottom:10px}
.tag{display:inline-block;font-weight:600;font-size:14px;border:2px solid var(--ink);border-radius:3px;padding:0 8px;margin-bottom:10px}
.fb{margin-top:12px;padding:12px;border-left:6px solid var(--tape);background:var(--bg)}
.hide{display:none}
.big{font-size:72px}.mode{display:flex;gap:16px;margin:4px 0 14px;flex-wrap:wrap}.mode label{display:flex;gap:6px;align-items:center}.alt{width:100%;margin-top:10px;background:transparent;border:2px solid var(--ink);border-radius:4px;padding:11px}
</style>
</head>
<body>
<main>
<div class="tape"></div>

<section id="start" class="card">
  <h1>Oficina da Moto</h1>
  <p class="mute">Diagnostica avarias, escolhe a solução certa e mostra que conheces todas as peças do motor. 10 perguntas, 3 vidas.</p>
  <label for="nome">O teu nome</label>
  <input id="nome" maxlength="20" placeholder="Ex.: Rui" autocomplete="given-name">
  <div class="mode"><label><input type="radio" name="modo" value="misto" checked style="width:auto;margin:0"> Misto</label><label><input type="radio" name="modo" value="so" style="width:auto;margin:0"> Só peças do motor</label></div>
  <button class="go" id="play">Abrir a oficina</button>
  <button class="alt" id="cbtn">Ver todas as peças do motor</button>
  <p class="mute" id="best"></p>
</section>

<section id="game" class="hide">
  <div class="bar"><span id="who"></span><span id="hud"></span></div>
  <div class="card">
    <span class="tag" id="cat"></span>
    <h2 id="q"></h2>
    <div id="opts"></div>
    <div id="fb" class="fb hide"></div>
    <button class="go hide" id="next" style="margin-top:14px">Seguinte</button>
  </div>
</section>

<section id="catalog" class="card hide">
  <h1 style="font-size:36px">Peças do motor</h1>
  <div id="clist"></div>
  <button class="go" id="cback" style="margin-top:16px">Voltar</button>
</section>

<section id="end" class="card hide">
  <p class="mute" id="rank"></p>
  <div class="big" id="final"></div>
  <p id="msg"></p>
  <button class="go" id="again">Jogar outra vez</button>
</section>
</main>

<script>
// [categoria, pergunta, [certa, erradas...], explicação]
const D="Diagnóstico",P="Peças do motor";
const BANK=[
[D,"A moto não arranca e o painel nem acende. Qual a primeira verificação?",["Bateria e terminais (carga e aperto)","Trocar o pneu traseiro","Mudar o óleo da forquilha","Afinar a corrente"],"Sem luz no painel, quase sempre é bateria descarregada ou terminais soltos/oxidados. Mede a tensão: deve estar perto de 12,6 V."],
[D,"O motor de arranque faz só “clic-clic” e não roda. Causa mais provável?",["Bateria fraca ou relé de arranque","Pastilhas gastas","Filtro de ar sujo","Corrente destensionada"],"Pouca corrente chega ao motor de arranque. Carrega ou troca a bateria e verifica o relé e as massas."],
[D,"Fumo azulado no escape indica…",["Óleo a ser queimado no motor","Mistura demasiado rica","Líquido de refrigeração na combustão","Água na gasolina"],"Segmentos, cilindros ou retentores de válvula gastos deixam o óleo entrar na câmara. Pede uma revisão ao motor."],
[D,"Fumo branco denso com cheiro adocicado, e o nível do líquido de refrigeração desce. O que se suspeita?",["Junta da cabeça do cilindro","Velas com folga a mais","Bateria em fim de vida","Pastilhas de travão gastas"],"O líquido passa para a combustão. Pára o motor para evitar danos graves e leva a moto à oficina."],
[D,"Fumo preto e consumo elevado. Que causa é comum?",["Mistura rica: filtro de ar entupido ou injeção/carburador desregulado","Falta de óleo","Corrente demasiado apertada","Pneus com pressão baixa"],"Entra pouco ar ou demasiado combustível. Limpa ou troca o filtro de ar e verifica a injeção."],
[D,"O manete do travão está “esponjoso”. Como se resolve?",["Purgar o circuito e verificar o fluido","Apertar a corrente","Encher mais os pneus","Trocar a vela"],"Ar no circuito comprime-se e tira força ao travão. Purga, repõe fluido DOT novo e inspeciona mangueiras."],
[D,"A corrente faz ruído e tem muita folga. O que fazer?",["Lubrificar e ajustar a tensão ao valor do manual","Cortar um elo","Pôr mais óleo no motor","Esvaziar um pouco os pneus"],"Corrente seca ou frouxa gasta pinhões e coroa. Lubrifica e ajusta a folga conforme o manual."],
[D,"O guiador vibra a alta velocidade. Verificação mais lógica?",["Equilibragem das rodas, pneus e rolamentos da direção","Cor do depósito","Nível do líquido do limpa-vidros","Tensão do cabo do acelerador apenas"],"Rodas desequilibradas, pneus deformados ou rolamentos de direção gastos são as causas habituais."],
[D,"O motor falha e engasga em ralenti. Por onde começar?",["Velas e limpeza do sistema de alimentação","Trocar o espelho","Pintar o quadro","Apertar os raios"],"Velas gastas e injetores ou carburador sujos causam falhas de combustão."],
[D,"Ao acelerar, a rotação sobe mas a moto não acompanha. Sintoma de…",["Embraiagem a patinar (discos gastos ou cabo sem folga)","Bateria cheia","Pneu da frente furado","Luz de stop fundida"],"Discos desgastados ou cabo mal regulado não transmitem toda a força. Regula a folga ou troca os discos."],
[D,"A luz de pressão do óleo acende em andamento. O que deves fazer?",["Parar já, desligar e verificar o nível de óleo","Continuar até casa","Acelerar para limpar o motor","Ignorar se for de dia"],"Sem pressão de óleo, o motor pode gripar em minutos. Pára em segurança e confirma o nível."],
[D,"O motor sobreaquece no trânsito parado. Causa típica?",["Falta de líquido ou ventoinha que não liga","Pneus novos","Corrente lubrificada","Bateria carregada"],"Sem fluxo de ar, só a ventoinha arrefece o radiador. Confirma o nível, o termóstato e o funcionamento da ventoinha."],
[D,"O pneu desgasta só no centro da banda. Provável causa?",["Pressão demasiado alta","Pressão demasiado baixa","Corrente larga","Vela suja"],"Pressão alta faz o centro apoiar demais. Respeita sempre os valores do manual e mede a frio."],
[D,"A bateria descarrega sozinha, mesmo com a moto parada. Que peça verificar?",["Consumos parasitas e regulador/retificador","Filtro de óleo","Amortecedor traseiro","Raios da roda"],"Um regulador avariado ou um acessório mal ligado esgota a bateria. Mede a corrente de fuga e a carga em andamento."],
[P,"Que peça transforma o movimento de sobe e desce do pistão em rotação?",["Virabrequim (cambota)","Comando de válvulas","Vela","Radiador"],"O virabrequim recebe a força da biela e gira, levando a potência à embraiagem e à caixa de velocidades."],
[P,"Qual peça liga o pistão ao virabrequim?",["Biela","Balancim","Junta","Cárter"],"A biela transmite a força do pistão ao virabrequim e converte movimento linear em rotativo."],
[P,"Qual peça comprime a mistura ar-combustível e recebe a força da explosão?",["Pistão","Filtro de ar","Termóstato","Corrente primária"],"O pistão sobe e desce dentro do cilindro, comprimindo a mistura e empurrado pela combustão."],
[P,"Para que servem os anéis (segmentos) do pistão?",["Vedar a combustão e controlar o óleo","Dar faísca","Filtrar o ar","Regular a corrente"],"Impedem fuga de gases para o cárter e limitam o óleo que sobe à câmara. Anéis gastos causam fumo azul."],
[P,"Qual peça abre e fecha as válvulas no tempo certo?",["Comando de válvulas (árvore de cames)","Bomba de óleo","Volante","Escape"],"Os ressaltos do comando empurram as válvulas, sincronizados com o virabrequim."],
[P,"Qual a função das válvulas de admissão e de escape?",["Deixar entrar a mistura e sair os gases queimados","Gerar corrente elétrica","Arrefecer o óleo","Travar a roda"],"A de admissão deixa entrar ar e combustível. A de escape liberta os gases depois da combustão."],
[P,"Qual peça fecha o topo do cilindro e abriga válvulas e vela?",["Cabeçote (cabeça do cilindro)","Cárter","Biela","Radiador"],"É no cabeçote que ficam as válvulas, a vela e a câmara de combustão."],
[P,"Qual peça veda a união entre o bloco e o cabeçote?",["Junta do cabeçote","Rolamento","Corrente","Retentor da forquilha"],"Se queima, o líquido de arrefecimento ou o óleo misturam-se ou há perda de compressão."],
[P,"Em que parte do motor ocorre a combustão?",["Cilindro","Cárter","Caixa de velocidades","Filtro de ar"],"A mistura é comprimida e inflamada dentro do cilindro, onde o pistão se move."],
[P,"Qual peça produz a faísca que inflama a mistura?",["Vela de ignição","Bobina de travão","Retificador","Termóstato"],"A vela é alimentada pela bobina de ignição e dá a faísca no momento certo."],
[P,"O que faz o balancim?",["Transmite o movimento do comando às válvulas","Limpa o ar","Mede a temperatura","Aperta a corrente"],"Funciona como alavanca entre o ressalto do comando e a válvula."],
[P,"Qual peça guarda o virabrequim e o óleo na parte de baixo do motor?",["Cárter","Cabeçote","Radiador","Escape"],"O cárter protege as peças internas e funciona como reservatório de óleo em muitas motos."],
[P,"Qual peça faz o óleo circular pelo motor?",["Bomba de óleo","Bomba de combustível","Vela","Retificador"],"Mantém a lubrificação de mancais, pistões e comando. A luz de óleo acende se a pressão falhar."],
[P,"Que peça mantém o líquido de arrefecimento na temperatura certa?",["Termóstato","Biela","Embraiagem","Vela"],"Abre e fecha para regular a temperatura. Se ficar preso, o motor pode sobreaquecer."],
[P,"Qual peça corta a transmissão entre motor e caixa ao puxar a manete?",["Embraiagem","Pistão","Cárter","Válvula"],"Os discos separam-se e permitem mudar de velocidade e parar sem apagar o motor."],
[P,"Qual peça permite escolher as relações de marcha?",["Caixa de velocidades","Radiador","Filtro de óleo","Vela"],"Seleciona as engrenagens que adaptam a rotação do motor à velocidade da roda."],
[P,"Qual peça sincroniza o virabrequim com o comando de válvulas?",["Corrente ou correia de distribuição","Corrente da roda traseira","Cabo do acelerador","Cabo de embraiagem"],"Se a distribuição salta, as válvulas abrem fora de tempo e o motor pode ser danificado."],
[P,"Num motor de 4 tempos, a que velocidade gira o comando em relação ao virabrequim?",["Metade","O dobro","A mesma","Quatro vezes"],"Cada válvula só abre uma vez em duas voltas do virabrequim."],
[P,"Qual peça dosa o combustível que vai ao motor (além da injeção)?",["Carburador","Retificador","Corrente","Escape"],"O carburador mistura ar e gasolina. Nas motos modernas, a injeção eletrónica faz esse trabalho."],
[P,"Qual peça protege o motor da poeira que entra com o ar?",["Filtro de ar","Vela","Junta","Biela"],"Um filtro entupido enriquece a mistura e causa fumo preto e perda de potência."],
[P,"Qual peça liberta os gases queimados para fora da moto?",["Escape","Radiador","Cárter","Embraiagem"],"Conduz os gases do cilindro, reduz o ruído e inclui o catalisador nas motos mais recentes."]
];

const GN={B:"Bloco e estrutura",M:"Pistão e virabrequim",C:"Cabeçote e distribuição",A:"Alimentação",E:"Ignição e elétrica",L:"Lubrificação",R:"Arrefecimento",T:"Transmissão",X:"Escape"};
const PARTS=[
"Bloco do motor|B|forma o corpo que abriga os cilindros e o virabrequim",
"Cilindro|B|é a câmara onde o pistão se move e ocorre a combustão",
"Cárter|B|protege o virabrequim por baixo e guarda o óleo",
"Bujão do cárter|B|permite drenar o óleo do motor",
"Junta da base do cilindro|B|veda a união entre o cilindro e o cárter",
"Junta do cabeçote|B|veda a união entre o cilindro e o cabeçote",
"Pistão|M|comprime a mistura e transmite a força da combustão à biela",
"Anéis de compressão|M|vedam a câmara de combustão contra fuga de gases",
"Anel de óleo|M|raspa o óleo da parede do cilindro e controla o consumo",
"Pino do pistão|M|articula o pistão à biela",
"Biela|M|liga o pistão ao virabrequim",
"Bronzinas (casquilhos)|M|reduzem o atrito entre a biela ou o virabrequim e os seus apoios",
"Virabrequim (cambota)|M|transforma o movimento linear do pistão em rotação",
"Volante do motor|M|armazena inércia e mantém a rotação regular",
"Árvore de equilíbrio|M|anula vibrações do motor com massas giratórias",
"Cabeçote (cabeça do cilindro)|C|fecha o topo do cilindro e aloja válvulas e vela",
"Válvula de admissão|C|deixa entrar a mistura de ar e combustível",
"Válvula de escape|C|deixa sair os gases queimados",
"Molas de válvula|C|fecham as válvulas depois de empurradas",
"Guias de válvula|C|mantêm a haste da válvula alinhada no seu movimento",
"Sedes de válvula|C|são o assento onde a válvula veda quando fecha",
"Comando de válvulas|C|abre e fecha as válvulas com os seus ressaltos",
"Balancim|C|transmite o movimento do comando à válvula",
"Corrente de distribuição|C|sincroniza o virabrequim com o comando de válvulas",
"Esticador da corrente|C|mantém a corrente de distribuição esticada",
"Tampa de válvulas|C|cobre o topo do cabeçote e protege o comando",
"Carburador|A|mistura ar e gasolina nas motos mais antigas",
"Corpo de borboleta|A|controla a quantidade de ar que entra no motor",
"Injetor|A|pulveriza o combustível no ar de admissão",
"Bomba de combustível|A|leva a gasolina do depósito à injeção",
"Filtro de ar|A|retém a poeira antes de o ar entrar no motor",
"Coletor de admissão|A|conduz o ar do filtro até ao cabeçote",
"Vela de ignição|E|produz a faísca que inflama a mistura",
"Bobina de ignição|E|eleva a tensão para a vela dar faísca",
"Motor de arranque|E|faz o motor girar na partida",
"Relé de arranque|E|liga a corrente da bateria ao motor de arranque",
"Estator (alternador)|E|gera energia elétrica com o motor a girar",
"Regulador/retificador|E|converte e limita a tensão do alternador para a bateria",
"Bateria|E|alimenta a moto na partida e guarda energia",
"ECU|E|é o computador que controla a injeção e a ignição",
"Bomba de óleo|L|faz o óleo circular pelo motor",
"Filtro de óleo|L|retém partículas e impurezas do óleo",
"Radiador|R|troca calor do líquido de arrefecimento com o ar",
"Bomba de água|R|faz o líquido de arrefecimento circular no motor",
"Termóstato|R|regula a temperatura do líquido de arrefecimento",
"Ventoinha|R|força o ar pelo radiador com a moto parada",
"Vaso de expansão|R|absorve a dilatação do líquido de arrefecimento",
"Embraiagem|T|desliga o motor da caixa quando se puxa a manete",
"Discos de embraiagem|T|transmitem a força por atrito quando pressionados",
"Molas da embraiagem|T|pressionam os discos para transmitir a força",
"Caixa de velocidades|T|fornece as relações de marcha",
"Garfos seletores|T|deslocam as engrenagens quando se muda de velocidade",
"Pinhão de saída|T|leva a força do motor à corrente da roda traseira",
"Coletor de escape|X|recebe os gases queimados do cabeçote",
"Catalisador|X|reduz os poluentes dos gases de escape",
"Silencioso|X|reduz o ruído do escape",
"Sonda lambda|X|mede o oxigénio no escape para ajustar a mistura"
].map(s=>{const [n,g,f]=s.split("|");return{n,g,f}});
const cap=s=>s[0].toUpperCase()+s.slice(1);
function genParts(){return PARTS.map(p=>{
  const o=shuffle(PARTS.filter(x=>x!==p)),s=o.filter(x=>x.g===p.g).concat(o.filter(x=>x.g!==p.g)).slice(0,3);
  if(Math.random()<.5)return[P,"Qual peça "+p.f+"?",[p.n].concat(s.map(x=>x.n)),p.n+" "+p.f+". Grupo: "+GN[p.g]+"."];
  return[P,"Para que serve: "+p.n+"?",[cap(p.f)].concat(s.map(x=>cap(x.f))),p.n+" "+p.f+". Grupo: "+GN[p.g]+"."];
})}
const $=id=>document.getElementById(id);
let Q=[],i=0,score=0,lives=3,streak=0,name="",locked=false;
const shuffle=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
const show=id=>["start","game","end","catalog"].forEach(s=>$(s).classList.toggle("hide",s!==id));
function getBest(){try{return +localStorage.getItem("oficina-best")||0}catch(e){return 0}}
function setBest(v){try{localStorage.setItem("oficina-best",v)}catch(e){}}
function lbl(){const b=getBest();$("best").textContent=b?"Melhor pontuação neste dispositivo: "+b:""}
lbl();

$("play").onclick=()=>{
  name=$("nome").value.trim()||"Mecânico";
  const so=document.querySelector('input[name=modo]:checked').value==='so';
  const p=shuffle(BANK.filter(x=>x[0]===P).concat(genParts())).slice(0,so?10:5),d=so?[]:shuffle(BANK.filter(x=>x[0]===D)).slice(0,5);
  Q=shuffle(d.concat(p));i=0;score=0;lives=3;streak=0;
  $("who").textContent=name;show("game");render();
};
$("nome").addEventListener("keydown",e=>{if(e.key==="Enter")$("play").click()});

function hud(){$("hud").textContent="Pergunta "+(i+1)+"/10 · "+"♥".repeat(lives)+" · "+score+" pts"}
function render(){
  const [c,q,o]=Q[i];locked=false;hud();
  $("cat").textContent=c;$("q").textContent=q;$("fb").classList.add("hide");$("next").classList.add("hide");
  const box=$("opts");box.innerHTML="";
  shuffle(o.map((t,k)=>({t,ok:k===0}))).forEach(x=>{
    const b=document.createElement("button");b.className="opt";b.textContent=x.t;b.onclick=()=>pick(b,x.ok);box.appendChild(b);
    b.dataset.ok=x.ok;
  });
}
function pick(btn,ok){
  if(locked)return;locked=true;
  document.querySelectorAll(".opt").forEach(b=>{if(b.dataset.ok==="true")b.classList.add("ok")});
  let txt;
  if(ok){streak++;const g=10+(streak>1?5*Math.min(streak-1,4):0);score+=g;txt="Certo, "+name+"! +"+g+" pts. "}
  else{btn.classList.add("bad");lives--;streak=0;txt="Não foi desta. "}
  const fb=$("fb");fb.textContent=txt+Q[i][3];fb.classList.remove("hide");hud();
  const n=$("next");n.textContent=(lives===0||i===9)?"Ver resultado":"Seguinte";n.classList.remove("hide");n.focus();
}
$("next").onclick=()=>{if(lives===0||i===9)return end();i++;render()};
function end(){
  show("end");$("final").textContent=score+" pts";
  const r=score>=100?"Mestre de oficina":score>=60?"Mecânico oficial":score>=30?"Aprendiz":"Ainda a tirar a carta";
  $("rank").textContent=name+", és: "+r;
  const best=getBest();
  $("msg").textContent=score>best?"Novo recorde neste dispositivo!":"Recorde: "+best+" pts.";
  if(score>best)setBest(score);lbl();
}
$("again").onclick=()=>{show("start")};
$("cbtn").onclick=()=>{const c=$("clist");c.innerHTML="";Object.keys(GN).forEach(g=>{const h=document.createElement("h2");h.textContent=GN[g];h.style.margin="18px 0 6px";c.appendChild(h);PARTS.filter(p=>p.g===g).forEach(p=>{const d=document.createElement("p");d.style.margin=".3em 0";const b=document.createElement("strong");b.textContent=p.n;d.append(b," – "+p.f+".");c.appendChild(d)})});show("catalog")};
$("cback").onclick=()=>show("start");
</script>
</body>
</html>
